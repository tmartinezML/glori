[project]
name = "glori"
version = "0.1.0"
description = "Generate LOFAR radio images"
authors = [
    {name = "Tobias Vicanek Martinez", email = "t-vicanek.martinez@web.de"},
]
dependencies = [
    "astropy==7.2.0",
    "colorlog==6.10.1",
    "datasets==4.2.0",
    "einops==0.8.1",
    "h5py==3.9.0",
    "inputimeout==1.0.4",
    "lightning==2.5.1",
    "matplotlib==3.10.8",
    "nflows==0.14",
    "numba==0.61.2",
    "numpy==1.25.2",
    "pandas==2.0.3",
    "photutils==2.2.0",
    "psutil==7.2.1",
    "pyarrow==21.0.0",
    "pytest==8.2.2",
    "randomname==0.2.1",
    "requests==2.32.5",
    "scipy==1.14.1",
    "scikit-image==0.22.0",
    "scikit-learn==1.7.1",
    "timm==1.0.16",
    "tqdm==4.66.6",
    "urllib3==2.0.4",
    "webdataset==0.2.111",
    "wpca==0.1",
    "art==6.5",
    "bdsf==1.13.0.post2",
    "indexed==1.3.0",
    "torch==2.2.1",
    "torchvision==0.17.1",
    "wandb==0.16.4",
    "wget==3.2",
    "wids==0.1.11",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["glori*"]